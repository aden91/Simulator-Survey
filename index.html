<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Suara Pasien Siti Hajar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Anton&display=swap">
<style>
/* Concept: peluncur aplikasi ala ERP modern. Beranda berisi kisi ikon di latar lavender; tiap aplikasi membuka navbar sendiri, panel kontrol, lalu isi. Hijau dan oranye sebagai warna merek (ambience RS), tiga warna kategori untuk tiga jenis responden. */
:root{
  --bg:#fbf5ea; --surface:#ffffff; --surface2:#f4ecdc; --ink:#1c2a1d; --muted:#5b6a58; --line:#e4d9c4;
  --brand:#1b7a3d; --brand-ink:#ffffff; --brand-soft:#d9f0de;
  --gold:#b8540a; --gold-soft:#ffe6cc;
  --good:#1b7a3d; --good-soft:#d6f0dc; --warn:#b4560a; --warn-soft:#ffe6cc; --bad:#c0392b; --bad-soft:#fadbd6;
  --k1:#1b7a3d; --k2:#d9690f; --k3:#6f8f12; --k1s:#d9f0de; --k2s:#ffe6cc; --k3s:#edf3cf; --org:#e8650a;
  --tile:#ffffff; --tile-shadow:0 1px 3px rgba(80,60,20,.14),0 6px 16px rgba(80,60,20,.08);
  --home-bg:linear-gradient(135deg,#ffe9cf 0%,#fff1de 46%,#cfeed3 46.2%,#b8e4bf 100%);
  --shadow:0 1px 2px rgba(40,50,30,.06),0 10px 28px rgba(40,50,30,.08);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1d13; --surface:#172b1c; --surface2:#21402a; --ink:#f2f7ec; --muted:#a9c3a6; --line:#2f5239;
  --brand:#6fdc8c; --brand-ink:#06210f; --brand-soft:#1b4a2a; --gold:#ffa24d; --gold-soft:#4a2c0e;
  --good:#6fdc8c; --good-soft:#174028; --warn:#ffa24d; --warn-soft:#4a2c0e; --bad:#ef7b6c; --bad-soft:#43201b;
  --k1:#6fdc8c; --k2:#ffa24d; --k3:#c9e265; --k1s:#1b4a2a; --k2s:#4a2c0e; --k3s:#38480f; --org:#ff8a3d;
  --tile:#21402a; --tile-shadow:0 1px 3px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.3);
  --home-bg:linear-gradient(135deg,#2a1a0a 0%,#3a2410 46%,#10281a 46.2%,#0b1f12 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1d13; --surface:#172b1c; --surface2:#21402a; --ink:#f2f7ec; --muted:#a9c3a6; --line:#2f5239;
  --brand:#6fdc8c; --brand-ink:#06210f; --brand-soft:#1b4a2a; --gold:#ffa24d; --gold-soft:#4a2c0e;
  --good:#6fdc8c; --good-soft:#174028; --warn:#ffa24d; --warn-soft:#4a2c0e; --bad:#ef7b6c; --bad-soft:#43201b;
  --k1:#6fdc8c; --k2:#ffa24d; --k3:#c9e265; --k1s:#1b4a2a; --k2s:#4a2c0e; --k3s:#38480f; --org:#ff8a3d;
  --tile:#21402a; --tile-shadow:0 1px 3px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.3);
  --home-bg:linear-gradient(135deg,#2a1a0a 0%,#3a2410 46%,#10281a 46.2%,#0b1f12 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);min-height:100%;padding-block:12px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.home{background:var(--home-bg);background-attachment:fixed}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}

.tray{display:flex;align-items:center;gap:4px;margin-left:auto}
.ti{position:relative;width:38px;height:38px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ti:hover{background:var(--surface2);color:var(--ink)}
.ti .bd{position:absolute;top:1px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font:700 .68rem/18px var(--f-body);text-align:center}
.live{width:11px;height:11px;border-radius:50%;background:var(--good);margin:0 8px;flex:none}
.co{font-weight:600;font-size:.9rem;padding:0 8px;white-space:nowrap}
@media(max-width:620px){.co{display:none}}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 .8rem var(--f-body);border:0}
.homebar{display:flex;align-items:center;gap:10px;padding-block:6px 0}
.homebar .bn{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.nav{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 10px;flex-wrap:wrap}
.homebtn{width:38px;height:38px;border:0;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.nav .an{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.sub{display:flex;gap:2px;flex-wrap:wrap}
.sub button{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.sub button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.badge-ex{display:inline-flex;align-items:center;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700}

.launcher{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:30px 10px;max-width:900px;margin:36px auto 12px}
.tile{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0;text-align:center}
.tile .ic{width:78px;height:78px;border-radius:18px;background:var(--tile);box-shadow:var(--tile-shadow);display:grid;place-items:center;transition:transform .18s;position:relative}
.tile:hover .ic{transform:translateY(-4px)}
.tile .ic svg{width:48px;height:48px}
.tile span.l{font-size:.86rem;font-weight:500}
.tile .bd{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:99px;background:var(--bad);color:#fff;font:700 .72rem/22px var(--f-body);padding:0 6px}
.homefoot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:34px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.card.raised{box-shadow:var(--shadow)}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:repeat(12,minmax(0,1fr))}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}}
.cp{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 14px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--brand);color:var(--brand-ink);text-decoration:none;display:inline-block}
.btn:disabled,.btn.off{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:.85rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:600}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
label.f{display:block;font-weight:600;font-size:.85rem;margin:16px 0 6px}
select,input[type=text],input[type=search],input[type=tel],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* survei */
.stage{max-width:620px;margin:18px auto 0}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:16px}
.prog span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s ease}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.q{font-family:var(--f-display);font-size:1.5rem;line-height:1.2;margin:8px 0 16px;text-wrap:balance}
.kindbtn{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.kindbtn:hover{border-color:var(--brand)}
.kdot{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;font:700 1.1rem var(--f-display)}
.k-pasien .kdot,.kc-pasien{background:var(--k1s);color:var(--k1)} .k-institusi .kdot,.kc-institusi{background:var(--k2s);color:var(--k2)} .k-nahdliyin .kdot,.kc-nahdliyin{background:var(--k3s);color:var(--k3)}
.qrow{display:grid;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow p{font-weight:600}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:700;font-size:1rem}
.yn button.y[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.yn button.t[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.err{color:var(--bad);font-size:.8rem;margin-top:4px}
.ring{position:relative;width:120px;height:120px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.9rem}
.endcard{border-radius:22px;padding:22px;color:var(--ink);background:linear-gradient(135deg,var(--kc-soft),var(--surface));border:2px solid var(--kc)}
.endcard .big{font-size:3rem;line-height:1}

/* dashboard */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi .v{font-family:var(--f-display);font-size:2.3rem;line-height:1;margin:6px 0 4px}
.kpi .k{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mid{background:var(--brand-soft);color:var(--brand)}
.bars{display:grid;gap:12px}
.bar .t{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;font-weight:600}
.bar .tr{position:relative;height:12px;background:var(--surface2);border-radius:99px;margin-top:5px}
.bar .fl{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar .tg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;left:82%}
.hm{border-collapse:separate;border-spacing:3px;width:100%;font-size:.82rem}
.hm th{font-weight:600;color:var(--muted);padding:4px 2px;text-align:center;font-size:.72rem}
.hm th:first-child,.hm td:first-child{text-align:left;white-space:nowrap;padding-right:8px;font-weight:600;font-size:.8rem}
.hm td{text-align:center;border-radius:8px;padding:9px 4px;font-variant-numeric:tabular-nums;font-weight:600}
.scroll{overflow-x:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kinds{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.kinds{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kcardx{border-radius:18px;padding:16px;display:grid;gap:6px;border:1px solid var(--line);background:var(--surface);min-width:0}
.kcardx .big{font-family:var(--f-display);font-size:2rem;line-height:1}
.gcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.gcard .em{font-size:2rem;line-height:1}
.gcard .mini{display:grid;grid-template-columns:90px 1fr 38px;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.gcard .mini i{display:block;height:7px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.gcard .mini i b{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.fact{font-size:.82rem;border-top:1px dashed var(--line);padding-top:8px}
.ai{border:1px solid var(--brand);background:linear-gradient(180deg,var(--brand-soft),var(--surface) 60%)}
.sug{display:grid;gap:12px;grid-template-columns:1fr;margin-top:16px}
@media(min-width:760px){.sug{grid-template-columns:1fr 1fr}}
.s-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.s-item.hi{border-color:var(--bad)}
.s-item .ev{font-size:.82rem;color:var(--muted)}
.s-item .act{font-size:.9rem}
.s-item .meta{font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.road{display:grid;gap:14px;grid-template-columns:1fr;margin-top:12px}
@media(min-width:900px){.road{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rcol{background:var(--surface2);border-radius:16px;padding:12px;display:grid;gap:10px;align-content:start;min-width:0}
.cm{border-top:1px solid var(--line);padding-block:12px;font-size:.9rem}
.cm:first-child{border-top:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tg2{display:inline-block;font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 9px;margin:4px 4px 0 0;background:var(--surface2);color:var(--muted)}
.shimmer{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.shimmer{animation:none}.prog span,.tile .ic{transition:none}}

.kb{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:800px){.kb{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kcol{background:var(--surface2);border-radius:16px;padding:12px;display:grid;gap:10px;align-content:start;min-width:0}
.kcol h3{display:flex;justify-content:space-between;align-items:center;font-size:.95rem}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;min-width:0}
.kcard.pri{border-left:4px solid var(--bad)}
.kcard .mv{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-top:2px;flex-wrap:wrap}
.kcard .mv button.mb{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 10px;font-size:.78rem;font-weight:600}

svg .tx{fill:var(--muted);font:11px var(--f-body)}
svg .gl{stroke:var(--line);stroke-width:1}

table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th,table.t td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
pre{margin:0;background:var(--surface2);border-radius:12px;padding:14px;overflow-x:auto;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow .n{flex:1 1 150px;background:var(--surface2);border-radius:14px;padding:12px;font-size:.85rem}
.flow .n b{display:block;font-family:var(--f-display);font-size:.98rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--muted);font-weight:700}
@media(max-width:700px){.flow .ar{display:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.88rem;z-index:20}

/* ===== Live Monitor: ruang kendali gelap, tetap sama di tema terang/gelap ===== */
body.livebody{--bg:#0b1f12;--surface:#12301b;--surface2:#1a4226;--ink:#f0f8ea;--muted:#a9c8a8;--line:#2a5836;--brand:#7be495;--brand-ink:#05210f;--brand-soft:#16482a;--gold:#ffb04f;--gold-soft:#4a300e;--good:#7be495;--good-soft:#14452a;--warn:#ffb04f;--warn-soft:#4a300e;--bad:#ff7d6e;--bad-soft:#4a1f1d;--org:#ff9a52;--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);color-scheme:dark;background:var(--bg);color:var(--ink)}
@media(min-width:900px){.c3{grid-column:span 3}.c9{grid-column:span 9}}
.lvbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:16px 0 8px}
.livepill{display:inline-flex;gap:8px;align-items:center;background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:4px 12px;font-weight:700;font-size:.78rem;letter-spacing:.08em}
.livepill i{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.clock{font:700 1.7rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.mood5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood5 .m{background:var(--surface2);border-radius:14px;padding:10px 4px;text-align:center}
.mood5 .m .e{font-size:1.8rem;line-height:1.1}
.bigface{font-size:4.4rem;line-height:1;text-align:center;margin-top:-6px}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.pulse{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.pulse span{font-size:1.4rem;line-height:1;padding:4px 5px;border-radius:9px;background:var(--surface2)}
.pulse span.new{animation:pop .5s ease;background:var(--brand-soft)}
.feed{display:grid;gap:8px;margin-top:10px}
.fi{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px;border-radius:14px;background:var(--surface2);align-items:start}
.fi.new{outline:2px solid var(--brand);animation:slidein .4s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.fi .e{font-size:2rem;line-height:1;text-align:center}
.fi .tl{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted)}
.fi .tg2,.al .tg2{background:var(--surface)}
.sla{font-variant-numeric:tabular-nums;font-weight:700}
.alist{display:grid;gap:8px;margin-top:10px}
.al{border-left:5px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;display:grid;gap:6px}
.al.high{border-left-color:var(--bad)} .al.med{border-left-color:var(--gold)} .al.done{opacity:.55}
.banner{border-radius:14px;padding:12px 16px;font-weight:600}
.banner.bad{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}

/* 1 jempol, 2 menyemangati, 3 kedip + hati jari, 4 kaget, 5 menangis, 6 marah, 7 peluk hati, 8 kacamata, 9 tertawa */
const ROV={5:[7,2,3],4:[1,8,9],3:[4],2:[5],1:[6]};
const ro=(l,cls)=>l&&ROV[l]?`<i class="ro rv${ROV[l][0]}${cls?' '+cls:''}" data-lvl="${l}" aria-hidden="true"></i>`:'';
function roCycle(){
  document.querySelectorAll('.ro.cyc').forEach(el=>{
    const arr=ROV[+el.dataset.lvl];if(!arr||arr.length<2)return;
    const n=((+el.dataset.n||0)+1)%arr.length;el.dataset.n=n;
    el.className=el.className.replace(/rv\d/,'rv'+arr[n]);
    el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap');
  });
}

(function seed(){
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const R=rng(20261113);
  const wp=(items,w)=>{let t=w.reduce((a,b)=>a+b,0),x=R()*t;for(let i=0;i<items.length;i++){x-=w[i];if(x<=0)return items[i]}return items[items.length-1]};
  const GIDS=GROUPS.map(g=>g.id);
  const D={
   pasien:{g:[.8,.03,.04,.04,.05,.03,.01],age:[.03,.1,.2,.22,.25,.2],mar:[.18,.66,.12,.04],dom:[.34,.3,.14,.08,.06,.05,.03]},

   nahdliyin:{g:[.22,.1,.44,.2,.02,.01,.01],age:[.05,.14,.2,.22,.24,.15],mar:[.14,.68,.14,.04],dom:[.45,.3,.1,.06,.04,.04,.01]}
  };
  const GMOD={pri:0,sek:.04,ormas:.03,kom:0,per:-.02,pem:-.04,lain:0};
  const PW={
   pasien:[.45,.02,.03,.1,.15,.35,.05,.1,.3,.02,.2],
   institusi:[.2,.6,.1,.03,.05,.12,.03,.03,.2,.3,.12],
   nahdliyin:[.15,.02,.55,.4,.3,.05,.25,.2,.3,.1,.08]
  };
  const out=[],N=260;
  for(let i=0;i<N;i++){
    const kind=wp(['pasien','institusi','nahdliyin'],[.5,.22,.28]),dd=D[kind];
    const group=wp(GIDS,dd.g),ageG=wp(AGES,dd.age),mar=wp(MARS,dd.mar),dom=wp(DOMS,dd.dom);
    const day=Math.floor(Math.pow(R(),1.15)*56),mood=(R()-.5)*.28,a={};
    qsOf(kind).forEach(q=>{
      let p=q.b+mood+(GMOD[group]||0);
      if(['alur','info','jangkau'].includes(q.th)){if(ageG==='60 ke atas')p-=.12;else if(ageG==='45–59')p-=.05;else if(ageG==='18–24')p+=.05}
      if(q.th==='jangkau'&&dom==='Luar daerah')p-=.15;
      if(q.th==='tunggu'&&day<21)p-=.08;
      if(q.th==='lansia'&&ageG==='60 ke atas')p-=.05;
      a[q.id]=R()<Math.max(.05,Math.min(.97,p));
    });
    const rem=PW[kind].slice(),prog=[],np=wp([1,2,3],[.2,.4,.4]);
    for(let k=0;k<np;k++){const id=wp(PROGS.map(p=>p.id),rem.map(x=>Math.max(x,.001)));prog.push(id);rem[PROGS.findIndex(p=>p.id===id)]=0}
    const neg=Object.keys(a).filter(k=>a[k]===false&&QM[k].neg),pos=Object.keys(a).filter(k=>a[k]===true&&QM[k].pos);
    let comment='';if(R()<.55){const parts=[];neg.slice(0,2).forEach(k=>parts.push(QM[k].neg));if(pos.length&&(R()<.5||!parts.length))parts.push(QM[pos[Math.floor(R()*pos.length)]].pos);comment=parts.join(' ')}
    const hasWA=R()<.6,orgs={sek:'Sekolah',ormas:'Pengurus ormas',kom:'Komunitas',per:'Perusahaan',pem:'Instansi mitra'};
    out.push({id:'seed-'+i,ts:new Date(NOW-day*864e5-R()*.9*864e5).toISOString(),kind,
      p:{age:ageG,marital:mar,domicile:dom,group,org:orgs[group]&&kind==='institusi'?orgs[group]+' contoh '+(1+Math.floor(R()*9)):'',name:'',service:kind==='pasien'?SERVICES[Math.floor(R()*5)]:''},
      wa:null,waShow:hasWA?'+62'+['812','813','857','852','878'][Math.floor(R()*5)]+'-••••-'+String(1000+Math.floor(R()*8999)):'',contact:hasWA&&R()<.85,
      a,prog,comment,source:'seed'});
  }
  Store.seed=out;
})();

function cases(rs){
  return rs.map(r=>{
    const no=Object.keys(r.a).filter(k=>r.a[k]===false),rk=r.a[REKOM[r.kind]]===false;
    if(!(rk||no.length>=3))return null;
    const a=age(r),def=r.source==='live'?'baru':a>21?'selesai':a>10?'proses':'baru';
    return {r,no,rk,status:CS[r.id]||def,pri:rk&&no.length>=3};
  }).filter(Boolean).sort((a,b)=>new Date(b.r.ts)-new Date(a.r.ts));
}

function render(){
  const v=$('#view');
  if(CUR!=='live'){stopLive();document.body.classList.remove('livebody');document.body.removeAttribute('data-mood');exitTV(true)}
  else document.body.classList.add('livebody');

let HK='';
function route(h){
  h=h||'home';const m=/^live(?:-(direktur|manajemen|pemasaran|operator))?$/.exec(h);
  if(m){CUR='live';if(m[1])LV.role=m[1];return}
  CUR=(h==='home'||APPS.some(a=>a.id===h))?h:'home';
}
function openApp(id){
  if(id!=='home'&&!APPS.some(a=>a.id===id))id='home';
  const h=id==='live'?'live-'+LV.role:id;HK=h;CUR=id;if(location.hash.slice(1)!==h)location.hash=h;render();window.scrollTo({top:0});

/* ===== SURVEI ===== */
const STEPS=['kind','profile','senang','mudah','fasil','program','done'];
const blank=()=>({step:0,kind:null,age:'',marital:'',domicile:'',group:'',org:'',name:'',service:'',wa:'',contact:true,a:{},prog:[],comment:'',saved:null});
let S=blank();
const okStep=()=>{
  const c=STEPS[S.step];
  if(c==='profile')return !!(S.age&&S.marital&&S.domicile&&S.group)&&(S.wa.trim()===''||!!norm(S.wa));
  if(AM[c])return qsOf(S.kind).filter(q=>q.a===c).every(q=>S.a[q.id]!=null);
  if(c==='program')return S.a[REKOM[S.kind]]!=null;
  return true;
};
function ynRow(q){return `<div class="qrow"><p>${q.q}</p><div class="yn" role="group" aria-label="${esc(q.s)}"><button class="y" data-yn="${q.id}" data-v="1" aria-pressed="${S.a[q.id]===true}">Ya</button><button class="t" data-yn="${q.id}" data-v="0" aria-pressed="${S.a[q.id]===false}">Tidak</button></div></div>`}
function chips(act,vals,cur){return `<div class="row" role="radiogroup">${vals.map(v=>`<button class="chip" role="radio" aria-checked="${cur===v}" data-act="${act}" data-v="${esc(v)}">${v}</button>`).join('')}</div>`}
function ringSVG(v){
  const r=50,C=2*Math.PI*r,len=Math.max(0,Math.min(100,v))/100*C;
  return `<div class="ring"><svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" style="stroke:var(--surface2)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" style="stroke:var(--kc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 60 60)"/></svg><b class="num">${fmt(v,0)}%</b></div>`;
}
function endCard(){
  const r=S.saved,k=KM[r.kind],own=stat([r]),peers=Store.all().filter(x=>x.p.group===r.p.group),pv=stat(peers);
  const msg={pasien:'Masukan Anda membantu kami menjaga layanan yang ramah dan mudah.',institusi:'Masukan Anda dipakai untuk menyusun program kemitraan tahun 2027.',nahdliyin:'Suara Anda ikut menentukan program kesehatan untuk warga Nahdliyin tahun 2027.'}[r.kind];
  const pr=r.prog.map(p=>PM[p].n);
  let h=`<div class="endcard" style="--kc:${k.col};--kc-soft:var(--${r.kind==='pasien'?'k1s':r.kind==='institusi'?'k2s':'k3s'})"><div class="row" style="gap:18px;align-items:center"><div class="big" aria-hidden="true">${face(own)}</div><div><span class="eyebrow" style="color:var(--kc)">Kartu terima kasih</span><h2 style="margin-top:2px">${nick(own)}</h2><p class="small muted">${esc(k.name)} · ${esc(GM[r.p.group])}</p></div><div style="margin-left:auto">${ringSVG(own)}</div></div>
  <p style="margin-top:14px">Jazakumullah khairan. ${msg}</p>
  <p class="small muted" style="margin-top:8px">Anda bergabung dengan <b class="num">${peers.length}</b> responden dari kelompok ${esc(GM[r.p.group].toLowerCase())}. Sebanyak <b class="num">${fmt(pv,0)}%</b> jawaban mereka Ya.</p>
  ${pr.length?`<p class="small" style="margin-top:8px"><b>Harapan program Anda:</b> ${pr.map(esc).join('; ')}.</p>`:''}
  ${r.wa&&r.contact?`<p class="small muted" style="margin-top:8px">Tim mutu dapat menghubungi Anda lewat WhatsApp ${esc(maskWA(r.wa))} jika ada kendala yang perlu dibantu.</p>`:''}</div>`;
  if(r.kind==='pasien'){
    const top=Object.keys(r.a).filter(k=>r.a[k]===true&&QM[k].pos).slice(0,2).map(k=>QM[k].s.toLowerCase());
    const dr=`Saya berobat di RSI Siti Hajar Sidoarjo. ${top.length?'Yang saya hargai: '+top.join(' dan ')+'. ':''}${r.comment?r.comment+' ':''}Semoga pelayanan terus terjaga.`;
    h+=`<div style="margin-top:20px"><h3>Mau berbagi ulasan di Google Maps?</h3><p class="muted small" style="margin:6px 0 10px">Sukarela. Draf ini boleh diubah dengan kata-kata Anda sendiri.</p><textarea id="review" rows="3">${esc(dr)}</textarea><div class="row" style="margin-top:10px"><button class="btn sm" data-copy="review">Salin draf</button><a class="btn ghost sm" href="https://www.google.com/maps/search/RSI+Siti+Hajar+Sidoarjo" target="_blank" rel="noopener">Buka Google Maps</a></div></div>`;
  }
  return h+`<div style="margin-top:20px;text-align:center"><button class="btn ghost sm" data-act="again">Isi survei berikutnya</button></div>`;
}
function renderSurvey(){
  const el=$('#survey');if(!el)return;
  const cur=STEPS[S.step],pct=Math.round(S.step/(STEPS.length-1)*100);
  let h=`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div><div class="card raised">`;
  const nav=(label='Lanjut')=>`<div class="row between" style="margin-top:20px"><button class="btn ghost sm" data-act="back">Kembali</button><button class="btn" id="nxt" data-act="next" ${okStep()?'':'disabled'}>${label}</button></div>`;
  if(cur==='kind'){
    h+=`<span class="eyebrow">Assalamu'alaikum</span><h1 class="q" style="font-size:1.8rem">Bantu RSI Siti Hajar Sidoarjo menjadi lebih baik</h1><p class="muted" style="margin-bottom:16px">Survei ini sekitar 2 menit, kebanyakan cukup menjawab Ya atau Tidak. Anda mengisi sebagai siapa?</p>
    ${KINDS.map(k=>`<button class="kindbtn k-${k.id}" data-act="kind" data-v="${k.id}"><span class="kdot">${k.ab}</span><span><b>${k.long}</b><br><span class="muted small">${k.sub}</span></span></button>`).join('')}`;
  } else if(cur==='profile'){
    const k=KM[S.kind],groups=GROUPS.filter(g=>!(S.kind==='institusi'&&g.id==='pri'));
    h+=`<span class="eyebrow">Profil · ${k.name}</span><h2 class="q">Sedikit tentang Anda</h2>
    <label class="f">Kelompok Anda mengisi sebagai</label><div class="row" role="radiogroup">${groups.map(g=>`<button class="chip" role="radio" aria-checked="${S.group===g.id}" data-act="group" data-v="${g.id}">${g.l}</button>`).join('')}</div>
    ${S.group&&S.group!=='pri'?`<label class="f" for="org">Nama organisasi atau institusi (opsional)</label><input type="text" id="org" value="${esc(S.org)}" maxlength="80" placeholder="Contoh: MI Nahdlatul Ulama">`:''}
    <label class="f">Umur</label>${chips('age',AGES,S.age)}
    <label class="f">Status pernikahan</label>${chips('marital',MARS,S.marital)}
    <label class="f" for="dom">Domisili</label><select id="dom"><option value="">Pilih domisili</option>${DOMS.map(d=>`<option ${S.domicile===d?'selected':''}>${d}</option>`).join('')}</select>
    ${S.kind==='pasien'?`<label class="f" for="svc">Layanan yang baru digunakan (opsional)</label><select id="svc"><option value="">Pilih layanan</option>${SERVICES.map(d=>`<option ${S.service===d?'selected':''}>${d}</option>`).join('')}</select>`:''}
    <label class="f" for="pname">Nama (opsional)</label><input type="text" id="pname" value="${esc(S.name)}" maxlength="80" autocomplete="off">
    <label class="f" for="wa">Nomor WhatsApp (opsional)</label><input type="tel" id="wa" inputmode="tel" value="${esc(S.wa)}" maxlength="18" placeholder="Contoh: 0812 3456 7890" autocomplete="off">
    <p class="err" id="waerr" ${S.wa.trim()===''||norm(S.wa)?'hidden':''}>Nomor belum sesuai. Gunakan format 08xx atau 628xx.</p>
    <label class="row" style="gap:8px;margin-top:10px;font-weight:500"><input type="checkbox" id="contact" ${S.contact?'checked':''}> Saya bersedia dihubungi lewat WhatsApp oleh RS jika ada kendala yang perlu dibantu</label>
    <p class="small muted" style="margin-top:8px">Nomor hanya dipakai bagian mutu untuk menindaklanjuti kendala, sesuai UU Pelindungan Data Pribadi, dan tidak dibagikan.</p>${nav()}`;
  } else if(AM[cur]){
    const a=AM[cur],qs=qsOf(S.kind).filter(q=>q.a===cur),i=['senang','mudah','fasil'].indexOf(cur)+1;
    h+=`<span class="eyebrow">${a.label} · ${i} dari 3</span><h2 class="q">${cur==='senang'?'Apakah pelayanan menyenangkan?':cur==='mudah'?'Apakah layanan mudah?':'Apakah fasilitasnya memadai?'}</h2>${qs.map(ynRow).join('')}${nav()}`;
  } else if(cur==='program'){
    const rq=QM[REKOM[S.kind]];
    h+=`<span class="eyebrow">Harapan untuk 2027</span><h2 class="q">Satu pertanyaan terakhir dan harapan Anda</h2>${ynRow(rq)}
    <label class="f">Program apa yang paling Anda harapkan di RSI Siti Hajar tahun 2027? (pilih maksimal 3)</label>
    <div class="row">${PROGS.map(p=>`<button class="chip small" data-act="prog" data-v="${p.id}" aria-pressed="${S.prog.includes(p.id)}">${p.n}</button>`).join('')}</div>
    <label class="f" for="cmt">Saran atau ide program lain (opsional)</label><textarea id="cmt" rows="3" maxlength="400" placeholder="Tulis saran atau pujian Anda">${esc(S.comment)}</textarea>${nav('Kirim')}`;
  } else h+=endCard();
  el.innerHTML=h+'</div>';
}
function sgo(d){S.step=Math.max(0,Math.min(STEPS.length-1,S.step+d));renderSurvey();window.scrollTo({top:0})}
const updNext=()=>{const n=$('#nxt');if(n)n.disabled=!okStep()};
async function submitSurvey(){
  const wa=S.wa.trim()?norm(S.wa):null,r={id:'live-'+Date.now(),ts:new Date().toISOString(),kind:S.kind,
    p:{age:S.age,marital:S.marital,domicile:S.domicile,group:S.group,org:S.org.trim(),name:S.name.trim(),service:S.service},
    wa,waShow:wa?maskWA(wa):'',contact:!!wa&&S.contact,a:{...S.a},prog:S.prog.slice(),comment:S.comment.trim(),source:'live'};
  await Store.submit(r);S.saved=r;S.step=STEPS.length-1;renderSurvey();toast('Tersimpan');window.scrollTo({top:0});
}

/* ===== Penanganan klik/ubah/input ===== */
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o){openApp(o.dataset.open);return}
  const i=e.target.closest('[data-int]');if(i){INT.tab=i.dataset.int;render();return}
  const dd=e.target.closest('[data-days]');if(dd){D.days=+dd.dataset.days;render();return}
  const vw=e.target.closest('[data-view]');if(vw){D.view=vw.dataset.view;render();return}
  const sn=e.target.closest('[data-sent]');if(sn){D.sent=sn.dataset.sent;render();return}
  const dm=e.target.closest('[data-dim]');if(dm){D.dim=dm.dataset.dim;render();return}
  const mv=e.target.closest('[data-move]');if(mv){CS[mv.dataset.move]=mv.dataset.to;saveCS();render();return}
  if(e.target.closest('#airun')){const run=$('#airun');$('#aibody').innerHTML='<p class="muted shimmer">Menganalisis jawaban, tren, dan usulan program…</p>';run.disabled=true;setTimeout(()=>{if(!$('#aibody'))return;$('#aibody').innerHTML=aiHTML(filt(D.kind,D.days),filt(D.kind,56));run.disabled=false},750);return}
  if(e.target.closest('#clrlive')){Store.clearLive();render();toast('Respons simulator dihapus');return}
  if(e.target.closest('#clrcase')){CS={};saveCS();render();toast('Status tindak lanjut dikembalikan');return}
  const b=e.target.closest('[data-copy]');
  if(b){const t=document.getElementById(b.dataset.copy);const txt=t.value!==undefined?t.value:t.textContent;
    const sel=()=>{try{const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);if(t.select)t.select()}catch(x){}};
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Tersalin')).catch(()=>{sel();toast('Teks dipilih, salin dari perangkat Anda')});return}
  const yn=e.target.closest('#survey [data-yn]');
  if(yn){const id=yn.dataset.yn,v=yn.dataset.v==='1';S.a[id]=v;yn.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===yn));updNext();return}
  const a=e.target.closest('#survey [data-act]');if(!a)return;const act=a.dataset.act,v=a.dataset.v;
  if(act==='kind'){S=blank();S.kind=v;S.group=v==='pasien'?'pri':'';sgo(1)}
  else if(act==='next'){if(!okStep())return;STEPS[S.step]==='program'?submitSurvey():sgo(1)}
  else if(act==='back')sgo(-1);
  else if(act==='group'){S.group=v;renderSurvey()}
  else if(act==='age'){S.age=v;renderSurvey()}
  else if(act==='marital'){S.marital=v;renderSurvey()}
  else if(act==='prog'){const i=S.prog.indexOf(v);if(i>=0)S.prog.splice(i,1);else if(S.prog.length<3)S.prog.push(v);else toast('Maksimal 3 program');a.setAttribute('aria-pressed',S.prog.includes(v));document.querySelectorAll('#survey [data-act="prog"]').forEach(x=>x.setAttribute('aria-pressed',S.prog.includes(x.dataset.v)))}
  else if(act==='again'){S=blank();renderSurvey()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dkind'){D.kind=t.value;render();return}
  if(t.dataset&&t.dataset.status){CS[t.dataset.status]=t.value;saveCS();render();return}
  if(!t.closest('#survey'))return;
  if(t.id==='dom'){S.domicile=t.value;updNext()}
  if(t.id==='svc')S.service=t.value;
  if(t.id==='contact')S.contact=t.checked;
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cq'){D.q=t.value;const l=$('#clist');if(l)l.innerHTML=clistHTML();return}
  if(!t.closest('#survey'))return;
  if(t.id==='org')S.org=t.value;
  if(t.id==='pname')S.name=t.value;
  if(t.id==='cmt')S.comment=t.value;
  if(t.id==='wa'){S.wa=t.value;const er=$('#waerr');if(er)er.hidden=S.wa.trim()===''||!!norm(S.wa);updNext()}
});
PAGES.survei=()=>{$('#appbody').innerHTML='<div class="stage" id="survey"></div>';renderSurvey()};

/* ===== Grafik tren ===== */
function trendSVG(base){
  const bk=Array.from({length:8},()=>[]);
  base.forEach(r=>{const b=Math.min(7,Math.floor(age(r)/7));bk[7-b].push(r)});
  const pts=bk.map((it,i)=>({i,v:it.length>=4?idx(it):null,lab:dfmt(new Date(NOW-(7-i+1)*7*864e5))}));
  const ok=pts.filter(p=>p.v!=null);
  if(ok.length<2)return '<p class="muted">Belum cukup data untuk tren mingguan.</p>';
  const mn=Math.min(...ok.map(p=>p.v)),mx=Math.max(...ok.map(p=>p.v));
  let lo=Math.max(0,Math.floor((mn-5)/5)*5),hi=Math.min(100,Math.ceil((mx+5)/5)*5);if(hi-lo<10)hi=lo+10;
  const W=640,H=240,ml=38,mr=16,mt=20,mb=32;
  const X=i=>ml+i*(W-ml-mr)/7,Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb);
  let g='';for(let v=lo;v<=hi;v+=5){g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tx" x="${ml-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  const line=ok.map((p,k)=>(k?'L':'M')+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area=line+` L${X(ok[ok.length-1].i)} ${H-mb} L${X(ok[0].i)} ${H-mb} Z`;
  const tgt=(82>lo&&82<hi)?`<line x1="${ml}" x2="${W-mr}" y1="${Y(82)}" y2="${Y(82)}" style="stroke:var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="tx" x="${W-mr}" y="${Y(82)-5}" text-anchor="end" style="fill:var(--gold)">Target contoh 82%</text>`:'';
  const xl=pts.map(p=>`<text class="tx" x="${X(p.i)}" y="${H-10}" text-anchor="middle">${p.lab}</text>`).join('');
  const dots=ok.map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="4" style="fill:var(--surface);stroke:var(--brand)" stroke-width="2.5"/>`).join('');
  const L=ok[ok.length-1];
  const end=`<circle cx="${X(L.i)}" cy="${Y(L.v)}" r="6" style="fill:var(--brand)"/><text x="${X(L.i)}" y="${Y(L.v)-12}" text-anchor="middle" style="fill:var(--ink);font:700 13px var(--f-body)">${fmt(L.v,0)}%</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tren persentase jawaban Ya per minggu, terakhir ${fmt(L.v,0)} persen"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--brand);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--brand);stop-opacity:0"/></linearGradient></defs>${g}${tgt}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" style="stroke:var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${end}${xl}</svg>`;
}

/* ===== Mesin analisis (berbasis aturan) ===== */
function analyze(rs,base){
  const n=rs.length,rec=base.filter(r=>age(r)<=14),prev=base.filter(r=>age(r)>14&&age(r)<=28);
  const ths=Object.keys(THEMES).filter(t=>t!=='rekom').map(t=>{
    const y=thIdx(rs,t),c=cnt(rs,k=>QM[k].th===t);if(y==null||c<8)return null;
    const a=thIdx(rec,t),b=thIdx(prev,t),delta=cnt(rec,k=>QM[k].th===t)>=6&&cnt(prev,k=>QM[k].th===t)>=6?a-b:null;
    let worst=null;GROUPS.forEach(g=>{const s=rs.filter(r=>r.p.group===g.id);if(cnt(s,k=>QM[k].th===t)>=10){const v=thIdx(s,t);if(!worst||v<worst.v)worst={v,l:g.l}}});
    const kinds=KINDS.filter(k=>qsOf(k.id).some(q=>q.th===t)).map(k=>k.name);
    return {t,y,c,delta,worst,kinds,gap:82-y,score:(82-y)+Math.max(0,-(delta||0))*1.5};
  }).filter(Boolean);
  const items=ths.filter(x=>x.gap>0||(x.delta!=null&&x.delta<-5)).sort((a,b)=>b.score-a.score).slice(0,4);
  const strong=ths.slice().sort((a,b)=>b.y-a.y).filter(x=>x.y>=88).slice(0,2);
  const asp=ASP.map(a=>({a,v:aspIdx(rs,a.id)})).filter(x=>x.v!=null).sort((x,y)=>x.v-y.v);
  const rk=stat(rs,k=>QM[k].a==='rekom'),all=idx(rs);
  let sum=`Dari ${n} responden, ${fmt(all,0)}% jawaban adalah Ya dan ${fmt(rk,0)}% bersedia merekomendasikan. `;
  if(asp.length>1)sum+=`Aspek terkuat adalah ${AM[asp[asp.length-1].a.id].label.toLowerCase()} (${fmt(asp[asp.length-1].v,0)}%), aspek terlemah ${asp[0].a.label.toLowerCase()} (${fmt(asp[0].v,0)}%). `;
  const dn=items.find(i=>i.delta!=null&&i.delta<-5);if(dn)sum+=`${THEMES[dn.t].label} turun ${fmt(-dn.delta,0)} poin persentase dalam 2 minggu terakhir. `;
  if(n<40)sum+='Jumlah responden masih kecil, baca sebagai gambaran awal.';
  /* program 2027 */
  const progs=PROGS.map(p=>{
    const votes=rs.filter(r=>r.prog.includes(p.id)),share=n?votes.length/n*100:0;
    const weak=p.th.map(t=>({t,y:thIdx(rs,t)})).filter(x=>x.y!=null&&x.y<82);
    const wscore=weak.reduce((s,x)=>s+(82-x.y)*.5,0);
    const byKind=KINDS.map(k=>{const s=rs.filter(r=>r.kind===k.id);return {k,v:s.length?s.filter(r=>r.prog.includes(p.id)).length/s.length*100:0}}).sort((a,b)=>b.v-a.v)[0];
    return {p,share,weak,byKind,score:share+wscore};
  }).sort((a,b)=>b.score-a.score);
  return {sum,items,strong,progs};
}
function evidenceP(x){
  const parts=[`Dipilih ${fmt(x.share,0)}% responden, paling banyak ${x.byKind.k.name.toLowerCase()} (${fmt(x.byKind.v,0)}%)`];
  if(x.weak.length)parts.push('menjawab masalah: '+x.weak.map(w=>`${THEMES[w.t].label.toLowerCase().replace('bpjs','BPJS').replace(/\brs\b/,'RS')} (${fmt(w.y,0)}% Ya)`).join(', '));
  return parts.join('; ')+'.';
}
function aiHTML(rs,base){
  const a=analyze(rs,base);
  const cards=a.items.map(i=>{
    const T=THEMES[i.t],hi=i.y<65||(i.delta!=null&&i.delta<-8);
    const ev=[`Hanya ${fmt(i.y,0)}% menjawab Ya (target 82%)`,i.delta!=null?(i.delta<0?`turun ${fmt(-i.delta,0)} poin`:`naik ${fmt(i.delta,0)} poin`)+' dibanding 2 minggu sebelumnya':null,i.worst?`terendah pada ${i.worst.l.toLowerCase()} (${fmt(i.worst.v,0)}%)`:null].filter(Boolean).join(' · ');
    return `<article class="s-item ${hi?'hi':''}"><div class="row between"><h3>${T.title}</h3><span class="pill ${hi?'bad':'warn'}">${hi?'Prioritas tinggi':'Prioritas sedang'}</span></div><p class="ev">${ev}</p><p class="act">${T.act}</p><p class="meta">Penanggung jawab: ${T.pic}<br>Ditanyakan kepada: ${i.kinds.join(', ')}<br>Target 30 hari: ≥ ${Math.min(90,Math.round(i.y+10))}% Ya</p></article>`}).join('');
  const keep=a.strong.length?`<article class="s-item"><div class="row between"><h3>Pertahankan yang sudah baik</h3><span class="pill good">Kekuatan</span></div><p class="act">${a.strong.map(d=>`${THEMES[d.t].label} (${fmt(d.y,0)}% Ya)`).join(' dan ')} sudah di atas target. Jadikan praktik di unit terkait contoh bagi unit lain dan apresiasi petugasnya.</p></article>`:'';
  const Q=[['Triwulan I–II 2027','Segera dikerjakan',a.progs.slice(0,3)],['Triwulan III–IV 2027','Tahap lanjutan',a.progs.slice(3,7)],['2028 dan seterusnya','Perencanaan jangka panjang',a.progs.slice(7)]];
  const road=`<div class="road">${Q.map(c=>`<section class="rcol"><div><h3>${c[0]}</h3><p class="small muted">${c[1]}</p></div>${c[2].map(x=>`<article class="s-item"><h3 style="font-size:.98rem">${x.p.n}</h3><p class="ev">${evidenceP(x)}</p><p class="meta">Penanggung jawab: ${x.p.pic}</p></article>`).join('')}</section>`).join('')}</div>`;
  const per=`<div class="kinds" style="margin-top:12px">${KINDS.map(k=>{const s=rs.filter(r=>r.kind===k.id);if(!s.length)return '';const tp=topProgs(s,3),w=Object.keys(THEMES).filter(t=>t!=='rekom'&&cnt(s,q=>QM[q].th===t)>=5).map(t=>({t,y:thIdx(s,t)})).sort((x,y)=>x.y-y.y).slice(0,2);
    return `<div class="kcardx"><div class="row"><span class="kdot kc-${k.id}" style="width:34px;height:34px;border-radius:10px;font-size:.9rem">${k.ab}</span><b>${k.name}</b></div><p class="small muted">${s.length} responden · ${fmt(idx(s),0)}% Ya</p><div class="fact"><b>Paling diharapkan:</b><br>${tp.map(([id,c])=>`${esc(PM[id].n)} (${Math.round(c/s.length*100)}%)`).join('<br>')}</div><div class="fact"><b>Paling perlu dibenahi:</b><br>${w.map(x=>`${THEMES[x.t].label} (${fmt(x.y,0)}% Ya)`).join('<br>')}</div></div>`}).join('')}</div>`;
  return `<p style="font-size:1rem;max-width:75ch">${a.sum}</p><h3 style="margin-top:20px">Prioritas perbaikan sekarang</h3><div class="sug">${cards||'<p class="muted">Tidak ada aspek yang perlu perbaikan mendesak pada filter ini.</p>'}${keep}</div>
  <h3 style="margin-top:24px">Peta jalan program 2027 dan seterusnya</h3><p class="small muted" style="margin-top:4px">Urutan dihitung dari persentase responden yang memilih program, ditambah seberapa lemah aspek yang dijawab program itu.</p>${road}
  <h3 style="margin-top:24px">Masukan dari tiap pihak</h3>${per}`;
}

function mkRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const PWP=[.45,.02,.03,.1,.15,.35,.05,.1,.3,.02,.2];
function genOne(R,ts,force){
  force=force||{};
  const h=new Date(ts).getHours(),si=force.svc!=null?force.svc:wpk(R,[.42,.14,.16,.16,.12]),svc=SERVICES[si],mood=(R()-.5)*.28,a={};

    if(q.th==='tunggu'&&svc==='Farmasi')p-=.1;
    if(q.th==='parkir'&&h>=9&&h<13)p-=.1;
    a[q.id]=R()<Math.max(.04,Math.min(.97,p));
  });
  const rem=PWP.slice(),prog=[],np=wpk(R,[.2,.4,.4])+1;
  for(let k=0;k<np;k++){const i=wpk(R,rem.map(x=>Math.max(x,.001)));prog.push(PROGS[i].id);rem[i]=0}
  const neg=Object.keys(a).filter(k=>a[k]===false&&QM[k].neg),pos=Object.keys(a).filter(k=>a[k]===true&&QM[k].pos);
  let comment='';if(R()<.55){const parts=[];neg.slice(0,2).forEach(k=>parts.push(QM[k].neg));if(pos.length&&(R()<.5||!parts.length))parts.push(QM[pos[Math.floor(R()*pos.length)]].pos);comment=parts.join(' ')}

}

function initLive(){
  if(LV.inited)return;LV.inited=true;
  const st=new Date();st.setHours(0,0,0,0);LV.start=st.getTime();
  const R=mkRng(st.getFullYear()*10000+(st.getMonth()+1)*100+st.getDate());LV.R=mkRng(Date.now()%2147483647);
  const W=[1,1,1,1,1,2,4,10,14,15,13,11,9,10,12,11,9,7,6,5,4,3,2,2],now=Date.now(),arr=[];
  for(let h=0;h<24;h++){
    const hs=LV.start+h*36e5;if(hs>now)break;
    const frac=Math.min(1,(now-hs)/36e5),n=Math.round((W[h]*.9+R()*1.5)*frac);
    for(let i=0;i<n;i++)arr.push(genOne(R,hs+R()*frac*36e5));
  }
  LV.today=arr;
  const Rd=mkRng(777);
  LV.dayAgg=Array.from({length:14},(_,i)=>({d:new Date(LV.start-(14-i)*864e5),n:Math.round(95+Rd()*40),v:78+Math.sin(i/2.2)*3+(i/13)*2.5+(Rd()-.5)*4}));
}

/* grafik */
function gaugeSVG(v){
  const cx=130,cy=120,r=100,pt=(val,rad)=>{const t=Math.PI*(1-val/100);return [cx+rad*Math.cos(t),cy-rad*Math.sin(t)]};
  const segs=[[0,40,'var(--bad)'],[40,60,'var(--org)'],[60,75,'var(--gold)'],[75,90,'var(--brand)'],[90,100,'var(--good)']];
  const arcs=segs.map(([a,b,c])=>{const p0=pt(a,r),p1=pt(b,r);return `<path d="M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${r} ${r} 0 0 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}" fill="none" style="stroke:${c}" stroke-width="16"/>`}).join('');
  const n0=pt(Math.max(0,Math.min(100,v)),r-26);

}
function hourlySVG(){
  const buck=Array.from({length:24},()=>[]);LV.today.forEach(r=>buck[new Date(r.ts).getHours()].push(r));
  const curH=new Date().getHours(),top=Math.ceil(Math.max(5,...buck.map(b=>b.length))/5)*5;
  const W=760,H=250,ml=34,mr=8,mt=34,mb=26,bw=(W-ml-mr)/24,ch=H-mt-mb;
  let g='';[0,top/2,top].forEach(v=>{const y=mt+ch-v/top*ch;g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="tx" x="${ml-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`});
  let b='';
  for(let h=0;h<24;h++){
    const n=buck[h].length,x=ml+h*bw;
    if(h<=curH&&n){const bh=n/top*ch;b+=`<rect x="${(x+bw*.15).toFixed(1)}" y="${(mt+ch-bh).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${bh.toFixed(1)}" rx="3" style="fill:var(--brand);fill-opacity:${h===curH?1:.55}"/>`}
    if(n>=2)b+=`<foreignObject x="${(x+bw/2-11).toFixed(1)}" y="1" width="22" height="22"><div style="font-size:20px;line-height:1">${moodOf(idx(buck[h])).e}</div></foreignObject>`;
    if(h%3===0)b+=`<text class="tx" x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${String(h).padStart(2,'0')}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Jumlah feedback per jam hari ini dengan emoticon suasana tiap jam">${g}${b}</svg>`;
}
function lineSVG(vals,labs,target){
  const ok=vals.map((v,i)=>({i,v})).filter(p=>p.v!=null);if(ok.length<2)return '<p class="muted">Belum cukup data.</p>';
  const mn=Math.min(...ok.map(p=>p.v),target),mx=Math.max(...ok.map(p=>p.v),target);
  const lo=Math.floor((mn-4)/5)*5,hi=Math.ceil((mx+4)/5)*5,n=vals.length,W=640,H=230,ml=34,mr=14,mt=22,mb=30;
  const X=i=>ml+i*(W-ml-mr)/(n-1),Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb);
  let g='';for(let v=lo;v<=hi;v+=5)g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tx" x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  const line=ok.map((p,k)=>(k?'L':'M')+X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const L=ok[ok.length-1],area=line+` L${X(L.i)} ${H-mb} L${X(ok[0].i)} ${H-mb} Z`;
  const xl=labs.map((l,i)=>(n-1-i)%2===0?`<text class="tx" x="${X(i)}" y="${H-10}" text-anchor="${i===n-1?'end':'middle'}">${l}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tren kepuasan 14 hari, hari ini ${fmt(L.v,0)} persen"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--brand);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--brand);stop-opacity:0"/></linearGradient></defs>${g}<line x1="${ml}" x2="${W-mr}" y1="${Y(target)}" y2="${Y(target)}" style="stroke:var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="tx" x="${W-mr}" y="${Y(target)-5}" text-anchor="end" style="fill:var(--gold)">Target contoh ${target}%</text><path d="${area}" fill="url(#gb)"/><path d="${line}" fill="none" style="stroke:var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${ok.map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="3.5" style="fill:var(--surface);stroke:var(--brand)" stroke-width="2"/>`).join('')}<circle cx="${X(L.i)}" cy="${Y(L.v)}" r="6" style="fill:var(--brand)"/><text x="${X(L.i)}" y="${Y(L.v)-12}" text-anchor="middle" style="fill:var(--ink);font:700 13px var(--f-body)">${fmt(L.v,0)}%</text>${xl}</svg>`;
}

const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const pdate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

function suRange(){
  const t0=sod(new Date()),D1=864e5;
  if(SU.mode==='live')return [t0,new Date(+t0+D1)];
  if(SU.mode==='kemarin')return [new Date(+t0-D1),t0];
  if(SU.mode==='7'||SU.mode==='30'||SU.mode==='56')return [new Date(+t0-(+SU.mode-1)*D1),new Date(+t0+D1)];
  let f=SU.from?pdate(SU.from):t0,t=SU.to?pdate(SU.to):f;if(t<f){const x=f;f=t;t=x}
  return [f,new Date(+t+D1)];
}
function suRecs(){
  initLive();syncReal();
  const seen=new Set(),out=[];
  Store.all().concat(LV.today).forEach(r=>{if(!seen.has(r.id)){seen.add(r.id);out.push(r)}});
  const [a,b]=suRange();
  return out.filter(r=>{const t=+new Date(r.ts);return t>=+a&&t<+b&&(SU.kind==='all'||r.kind===SU.kind)});
}
function suList(){

  if(SU.only)rs=rs.filter(r=>r.comment);

  else if(a==='pause'){TV.pause=!TV.pause;b.textContent=TV.pause?'Putar':'Jeda'}
  else if(a==='role')tvSetRole(b.dataset.v);
  else if(a==='full'){try{if(document.fullscreenElement)document.exitFullscreen();else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Layar penuh diblokir browser, tekan F11'))}}catch(x){}}
  else if(a==='exit'){LV.tvOff=true;exitTV()}
});
document.addEventListener('mousemove',tvShow);
document.addEventListener('touchstart',tvShow,{passive:true});
window.addEventListener('resize',tvFit);
document.addEventListener('keydown',e=>{
  if(!TV.el)return;
  const k=e.key;
  if(k==='Escape'){if(!document.fullscreenElement){LV.tvOff=true;exitTV()}}
  else if(k==='ArrowRight'){TV.idx++;TV.t0=0;updateTV(true);tvShow()}
  else if(k==='ArrowLeft'){TV.idx--;TV.t0=0;updateTV(true);tvShow()}
  else if(k===' '){e.preventDefault();const p=TV.el.querySelector('#tvpause');if(p)p.click()}
  else if(k==='f'||k==='F'){const f=TV.el.querySelector('[data-tv="full"]');if(f)f.click()}
  else if(k>='1'&&k<='3')tvSetRole(TVROLES[+k-1]);
});
setInterval(roCycle,6000);

/* ===== Mulai ===== */
HK=location.hash.slice(1)||'home';route(HK);
render();
</script>
